<!doctype html><html lang="en"><meta charset="utf-8"><title>Batch38 browser regression diagnosis</title><style>body{font:16px system-ui;max-width:1000px;margin:35px auto;padding:20px}button{padding:12px;margin:10px}textarea{width:100%;height:450px}label{display:block;margin:10px}</style><h1>Batch38 actual browser diagnosis</h1><p>Nine archived browser CPU regressions. Original bundles and full-output checks; separate captured JS, full Wasm and resident destinations. The untimed validation button runs no timing samples.</p><label><input id="gate" type="checkbox"> Parent granted the exclusive profiling / timing window</label><label>Fresh result name <input id="name" value="browser-reproduce-process-1.json" size="42"></label><button id="validate">Untimed validation</button><button id="reproduce">Uninstrumented reproduction</button><p id="status">Ready</p><a id="download" hidden>Download receipt</a><textarea id="result" readonly></textarea><script type="module">
import{diagnoseBrowser}from'./diagnose-pipeline38.browser.mjs';const status=document.querySelector('#status'),result=document.querySelector('#result');
async function run(mode){if(mode==='reproduce'&&!document.querySelector('#gate').checked){status.textContent='Exclusive timing window is required';return}document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const d=await diagnoseBrowser({mode,authorized:document.querySelector('#gate').checked},f=>status.textContent=f);window.DIAG_RESULT=d;const text=JSON.stringify(d,null,2)+'\n';result.value=text;const name=mode==='validate'?'browser-validate-controls.json':document.querySelector('#name').value;const response=await fetch('/__diagnosis-results/'+encodeURIComponent(name),{method:'POST',headers:{'content-type':'application/json'},body:text});status.textContent=d.status+' · '+d.validation.length+' validation rows · '+d.samples.length+' samples · '+(response.ok?'saved fresh receipt':await response.text());const link=document.querySelector('#download');link.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));link.download=name;link.hidden=false;}catch(e){status.textContent=String(e);result.value=e.stack}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelector('#validate').onclick=()=>run('validate');document.querySelector('#reproduce').onclick=()=>run('reproduce');
</script></html>
