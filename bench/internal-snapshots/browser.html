<!doctype html><meta charset="utf-8"><title>Ink snapshot conformance</title>
<button id="run">Run browser conformance</button><pre id="status">Ready</pre>
<script type="module">
import {loadInk} from '../../build/collect-before-build-parity/gpu-module/ink-gpu.mjs';
const button=document.querySelector('#run'),status=document.querySelector('#status');
button.onclick=async()=>{
 button.disabled=true;status.textContent='Running';let engine;
 try{
  const script=await(await fetch('../../build/collect-before-build-parity/gpu-script.json')).json();
  const expected=await(await fetch('../../build/collect-before-build-parity/expected.json')).json();
  engine=await loadInk(new URL('../../build/collect-before-build-parity/gpu-module/',location.href));
  const results=[];
  for(let i=0;i<script.length;i++){
   const step=script[i],result=await engine.call(step.pure,step.args,{backend:'gpu-required'});
   if(result.backend!=='gpu'||!result.counters?.dispatches)throw Error('required GPU dispatch missing');
   if(JSON.stringify(result.value)!==JSON.stringify(expected[i].reply.value))throw Error('logical result mismatch at '+i);
   results.push(result);
  }
  const report={status:'passed',host:navigator.userAgent,manifest:engine.manifest,results};
  const saved=await fetch('/save-conformance',{method:'POST',body:JSON.stringify(report)});if(!saved.ok)throw Error('saving conformance failed: '+saved.status);
  status.textContent='Passed: '+results.length+' actual WebGPU calls. Saved conformance report.';
 }catch(error){status.textContent='FAILED: '+error.stack;}
 finally{if(engine)await engine.dispose();}
};
</script>
