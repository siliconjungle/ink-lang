  wgpu-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INK_TEST_WGPU: '1'
      INK_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
      WGPU_BACKEND: vulkan
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      INK_TEST_WASM: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned knowledge instrumentation dependencies
      run: npm ci --prefix knowledge/tools/js-instrumentation --ignore-scripts --no-audit --no-fund
    - name: Install Vulkan software adapter
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
    - name: Reuse checked dependency builds
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/release
          core/target/debug
          runtime/target/debug
        key: ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-
      continue-on-error: true
    - name: Private device runtime directory and replayable seeds
      run: |
        mkdir -p build/xdg
        chmod 700 build/xdg
        echo "XDG_RUNTIME_DIR=$PWD/build/xdg" >> "$GITHUB_ENV"
        python3 - <<'PY'
        import os
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
        PY
    - run: |
        cargo fetch --locked
        cargo fetch --locked --manifest-path core/Cargo.toml
    - name: Fetch the pinned device runtime dependencies
      run: |
        mkdir -p build/gpu-deps/src
        cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/gpu-deps/
        python3 - <<'PY'
        from pathlib import Path
        Path('build/gpu-deps/src/main.rs').write_text('fn main() {}\n')
        with Path('build/gpu-deps/Cargo.toml').open('a') as f:
            f.write('\n[workspace]\n')
        PY
        cargo fetch --locked --manifest-path build/gpu-deps/Cargo.toml
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned proof authoring
      run: python -m pip install python-sat==1.9.dev5
    - name: Browser CPU, JavaScript and actual WebGPU parity
      run: |
        node --test bench/gpu/contract-replay.test.mjs bench/gpu/engine-profile-assets.test.mjs bench/gpu/engine-profile-order.test.mjs
        python3 -m unittest discover -s bench/gpu -p 'test_analyse_engine_profile.py'
        python3 -m unittest discover -s bench/gpu -p 'test_prepare_browser.py'
        INK_TEST_WASM=1 cargo test --test feature_parity gpu -- --nocapture --test-threads=1
        INK_TEST_WASM=1 cargo test --test bend_features parallel_buffers_recursion_and_scratch_agree_on_all_backends -- --nocapture
        INK_TEST_WASM=1 cargo test --test source_contracts -- --nocapture --test-threads=1
        INK_TEST_WASM=1 cargo test --test lowering_parity resident_collection_lengths_survive_feedback -- --exact --nocapture
        INK_TEST_WASM=1 cargo test --test physical_capabilities semantic_word_parity -- --nocapture --test-threads=1
        python bench/gpu/prepare-lowering-parity-browser.py
        python bench/gpu/prepare-word-parity-browser.py
        npm ci --prefix bench/gpu --ignore-scripts --no-audit --no-fund
        node bench/gpu/lowering-parity-browser.mjs "$(command -v google-chrome)"
        INK_TEST_WGPU=1 cargo test --test database_planning recursive_database_plan_preserves_every_observation_and_original_checkpoints -- --exact --nocapture
        python bench/gpu/prepare-database-plan-browser.py
        node bench/gpu/database-plan-browser.mjs "$(command -v google-chrome)"
        target/debug/ink build bench/gpu/resident-profile.ink --target webgpu -o build/engine-lifetime-conformance
        INK_CHROME="$(command -v google-chrome)" INK_ALLOW_SOFTWARE_GPU=1 node bench/gpu/engine-profile-browser.mjs smoke build/engine-lifetime-conformance/checks.json build/engine-lifetime-conformance bench/gpu/engine-profile-smoke.json
    - name: Retain GPU failure reproductions
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wgpu-browser-conformance
        path: |
          build/browser-lowering-parity.json
          build/engine-lifetime-conformance/checks.json
          build/database-plan-browser.json
          build/database-plan-conformance/checks.json
          build/database-plan-conformance/routed-plan.json
          build/database-plan-conformance/oracle.json
          build/temporary-c-test/test.c
          build/lowering-residency/*.json
          build/lowering-residency/*.wgsl
          build/generated-parity-f32/source.ink
          build/generated-parity-f32/script.json
          build/generated-parity-f32/expected.json
          build/generated-parity-u64/source.ink
          build/generated-parity-u64/script.json
          build/generated-parity-u64/expected.json
          build/enforced-keep-migration/oracle.json
          build/enforced-parity/numeric-definitions/oracle.json
          build/generated-parity-bend/source.ink
          build/generated-parity-bend/script.json
          build/generated-parity-bend/expected.json
          build/generated-parity-bend/gpu-script.json
