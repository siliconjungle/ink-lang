        PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_store.py
        PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_state_calculus.py
        INK_COMPILER="$PWD/target/debug/ink" PYTHONPATH=planner:knowledge python3 -m unittest discover -s knowledge/tests -p test_frozen_specialization.py
        INK_COMPILER="$PWD/target/debug/ink" PYTHONPATH=planner:knowledge python3 -m unittest discover -s knowledge/tests -p test_frozen_traversal.py
