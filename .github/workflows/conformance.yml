        PYTHONPATH=planner:knowledge python3 planner/tests/automatic_measurement_integration.py target/debug/ink rust
        PYTHONPATH=planner:knowledge python3 -m unittest discover -s planner/tests -p test_offline_measurements.py
        PYTHONPATH=planner:knowledge python3 -m unittest discover -s planner/tests -p test_native_measurements.py
