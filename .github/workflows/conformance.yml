        restore-keys: |-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-
      continue-on-error: true
    - name: Build the pinned compiler
      run: cargo build --locked --bin ink
    - name: Composable state proofs, publication, journals and bounded search
      run: |
        cargo test --test composable_state --test journal_compaction --test indexed_laws --test composable_knowledge --test sorted_tables
        PYTHONPATH=planner:knowledge python3 -m unittest discover -s planner/tests -p test_compiled_planning.py
