  complete-conformance:
    runs-on: ubuntu-24.04
    if: always()
    needs:
    - declared-feature-parity
    - cpu-foundations
    - cpu-knowledge
    - cpu-planning
    - cpu-conformance
    - cpu-contracts
    - cpu-representations
    - wgpu-native
    - wgpu-browser
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: cpu-*
        path: build/partition-receipts
    - name: Require every job and complete partition coverage
      env:
        INK_JOB_RESULTS: ${{ toJSON(needs) }}
      run: python3 tools/check_ci_partitions.py build/partition-receipts
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
