name: Executable conformance
permissions:
  contents: read
defaults:
  run:
    shell: bash tools/ci_step.sh {0}
concurrency:
  group: conformance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  declared-feature-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fail on any required CPU or GPU contract gap
      run: python3 tools/check_feature_parity.py --scope contract --receipt build/enforced-parity/contract-audit.json
    - name: Audit resident measurement report provenance
      run: python3 -m unittest discover -s bench/gpu -p 'test_analyse_resident_profile.py'
    - name: Audit packed-circuit benchmark receipts
      run: python3 bench/handwired/analyse.py reports/handwired-packed-circuits-2026-10-15 --check
    - name: Audit conditional word-fact benchmark receipts
      run: |
        python3 bench/conditional-facts/analyse.py reports/conditional-facts-2026-10-15 --check
        python3 bench/prepared-tables/analyse.py reports/prepared-tables-2026-10-15
        python3 tools/audit_learning_receipts.py reports/adaptive-learning-2026-10-15
        python3 tools/audit_whole_computation_learning.py reports/whole-computation-learning-2026-10-15
        python3 bench/differentiable-preparation/analyse.py reports/differentiable-preparation-2026-10-15
        python3 bench/batched-differentiation/analyse.py reports/batched-differentiation-2026-10-15
        python3 reports/frozen-deployment-2026-10-15/audit.py
        python3 bench/structured-preparation/analyse.py reports/structured-preparation-2026-10-16 --check
    - name: Check conformance partition coverage
      run: python3 tools/test_ci_partitions.py
    - name: Retain explicit missing capabilities
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: declared-feature-parity-inventory
        path: build/enforced-parity/contract-audit.json
  cpu-foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INK_PARITY_REQUIRE_ALL: '1'
      INK_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      INK_TEST_WASM: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned knowledge instrumentation dependencies
      run: npm ci --prefix knowledge/tools/js-instrumentation --ignore-scripts --no-audit --no-fund
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Replayable conformance seeds
      run: |-
        python3 - <<'PY'
        import os
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
        PY
    - name: Install pinned representation proof authoring dependency
      run: python -m pip install python-sat==1.9.dev5
    - name: Install pinned independent proof checker
      run: |
        curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
        echo "INK_TEST_LEAN=$HOME/.elan/bin/lean" >> "$GITHUB_ENV"
    - name: Rebuild disposable knowledge index
      run: |
        python tools/check_committed_snapshot.py
        python -m ink_knowledge --root . rebuild
      working-directory: knowledge
      shell: bash
    - name: Fetch locked dependencies
      run: |
        cargo fetch --locked
        cargo fetch --locked --manifest-path core/Cargo.toml
        # The runtime tests run `cargo --locked`; a stale lock must fail
        # here, by name, rather than inside the first runtime test.
        cargo fetch --locked --manifest-path runtime/Cargo.toml
    - name: Fetch pinned compiled host dependencies
      run: |
        mkdir -p build/host-deps/src
        cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/host-deps/
        python3 - <<'PYTHON'
        from pathlib import Path
        Path('build/host-deps/src/main.rs').write_text('fn main() {}\n')
        with Path('build/host-deps/Cargo.toml').open('a') as f:
            f.write('\n[workspace]\n')
        PYTHON
        cargo fetch --locked --manifest-path build/host-deps/Cargo.toml
    - name: Reuse checked dependency builds
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/release
          core/target/debug
          runtime/target/debug
        key: ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-
      continue-on-error: true
    - name: Runtime policies and failure injection
      run: |
        node --test runtime/tests/backend-selection.mjs runtime/tests/durable-state.mjs runtime/tests/scheduled-actions.mjs runtime/tests/initial-state.mjs runtime/tests/route-resources.mjs runtime/tests/usage-profile.mjs
        node lowerings/gpu/tests/device_graph.mjs
    - name: Independent core and source-bound value admission
      run: |
        cargo test --test contract_fixtures --test checked_emission -- --nocapture
        cargo test --manifest-path core/Cargo.toml --offline
        python3 - <<'PYCORE'
        import json, subprocess
        r=json.load(open('reports/structured-preparation-2026-10-16/core-package.json'))
        subprocess.run(['git','fetch','--no-recurse-submodules','--depth=1','origin',r['commit'],r['source']],check=True)
        PYCORE
        python3 tools/check_core_package.py reports/structured-preparation-2026-10-16/core-package.json --log build/private-core-validation.log --receipt build/private-core-validation.json
        cargo test --manifest-path lowerings/rust/Cargo.toml --lib
        # The whole suite: fuzz_logic_objects re-declares every first-order
        # knowledge object, so checker changes cannot silently strand proofs.
        cargo test --test hardening
        cargo test --test rust_cpu_adapters --test javascript_package --test literal_collections_package --test javascript_word_collections
        cargo test --manifest-path native-support/Cargo.toml
        CARGO_TARGET_DIR=target cargo test --manifest-path lowerings/gpu/Cargo.toml --test temporary_bounds
        cargo test --test distribution --test source_syntax --test action_values --test general_laws --test semantic_optimisation --test reference_evaluation_budget --test automatic_compilation
        cargo test --test internal_snapshots --test collect_before_build --test proved_refinement_parity --test adaptive_learning --test trained_build --test frozen_state --test policy_learning --test differentiation --test reverse_learning --test scalable_state
        cargo test --test physical_capabilities --test gpu
        cargo build --bin ink --offline
        python3 tools/check_bit_circuit_laws.py --receipt build/bit-circuit-replay.json
    - name: Retain reproducible programs, seeds and expected outcomes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-foundations-evidence
        path: |
          build/automatic-contract-probes/*.json
          build/automatic-compilation-parity/*.json
          build/automatic-compilation-parity/source.ink
          build/automatic-compilation-alternative/*.json
          build/automatic-compilation-alternative/source.ink
          build/lowering-residency/*.json
          build/lowering-residency/*.wgsl
          build/generated-parity-f32/source.ink
          build/generated-parity-f32/script.json
          build/generated-parity-f32/expected.json
          build/generated-parity-u64/source.ink
          build/generated-parity-u64/script.json
          build/generated-parity-u64/expected.json
          build/enforced-keep-migration/oracle.json
          build/enforced-parity/numeric-definitions/oracle.json
          build/enforced-parity/cpu-audit.json
          build/async-parallel-transactions/source.ink
          build/async-parallel-transactions/script.json
          build/async-parallel-transactions/expected.json
          build/generated-parity-bend/source.ink
          build/generated-parity-bend/script.json
          build/generated-parity-bend/expected.json
          build/generated-parity-bend/gpu-script.json
          build/boolean-verdict-test/*.lean
          build/mixed-durable-native/source.ink
          build/mixed-durable-native/initial.json
          build/mixed-durable-native/recovery.json
          build/mixed-durable-native/expected.json
          build/representation-parity/**/checks.json
          build/representation-parity/**/source.ink
          build/representation-parity/**/request.json
          build/representation-parity/**/oracle.json
          build/representation-parity/**/producer.log
          build/representation-parity/**/*-run.log
          build/numerical-state-parity/source.ink
          build/numerical-state-parity/script.json
          build/numerical-state-parity/expected.json
          build/numerical-state-parity/gpu-script.json
          build/generated-parity/source.ink
          build/generated-parity/seeds.json
          build/generated-parity/script.json
          build/generated-parity/expected.json
          build/lowering-parity/source.ink
          build/lowering-parity/script.json
          build/lowering-parity/expected.json
          build/selected-checkpoint-parity/source.ink
          build/selected-checkpoint-parity/script.json
          build/selected-checkpoint-parity/expected.json
          build/selected-checkpoint-parity/input-core.json
          build/selected-checkpoint-parity/selected-core.json
          build/selected-checkpoint-parity/selection.json
          build/action-transitions-native/*.json
          build/action-transitions-native/source.ink
          build/action-transitions-native-evidence/*.json
          build/action-rule-parity/*.json
          build/action-rule-parity/source.ink
          build/action-rule-search/*.json
          build/action-rule-native-search/*.json
        retention-days: 30
