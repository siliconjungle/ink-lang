        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned knowledge instrumentation dependencies
      run: npm ci --prefix knowledge/tools/js-instrumentation --ignore-scripts --no-audit --no-fund
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Replayable conformance seeds
      run: |-
        python3 - <<'PY'
        import os
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
        PY
    - name: Reuse checked dependency builds
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/release
          core/target/debug
          runtime/target/debug
        key: ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'runtime/Cargo.lock') }}-
          ${{ runner.os }}-ink-conformance-v1-${{ github.job }}-${{ strategy.job-index }}-
      continue-on-error: true
    - name: Install pinned proof authoring
      run: python -m pip install python-sat==1.9.dev5
    - name: Audit committed catalogue and rebuild disposable index
      working-directory: knowledge
      shell: bash
      run: |
        python tools/check_committed_snapshot.py
        python -m ink_knowledge --root . rebuild
    - name: Fetch locked compiled host dependencies
      run: |
        cargo fetch --locked
        cargo fetch --locked --manifest-path core/Cargo.toml
        mkdir -p build/host-deps/src
        cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/host-deps/
        python3 - <<'PY'
        from pathlib import Path
        Path('build/host-deps/src/main.rs').write_text('fn main() {}\n')
        with Path('build/host-deps/Cargo.toml').open('a') as f:
            f.write('\n[workspace]\n')
        PY
        cargo fetch --locked --manifest-path build/host-deps/Cargo.toml
    - name: Reauthor current source fixtures through normal proof admission
      run: |
        cargo build --release --bin ink
        python3 bench/composable-state/prepare-fixtures.py --compiler target/release/ink
    - name: Run complete isolated conformance partition
      run: python3 tools/check_feature_parity.py --scope cpu --shard representations --partition-index ${{ matrix.partition }} --partition-count 4 --partition-tests --run --receipt build/enforced-parity/cpu-representations-${{ matrix.partition }}.json
    - name: Retain exact programs, proof packets and host histories
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-representations-${{ matrix.partition }}
        path: |-
          build/enforced-parity/representations-audit.json
          build/representation-parity/**/checks.json
          build/representation-parity/**/source.ink
          build/representation-parity/**/request.json
          build/representation-parity/**/oracle.json
          build/representation-parity/**/producer.log
          build/representation-parity/**/*-run.log

          build/enforced-parity/cpu-representations-${{ matrix.partition }}.json
        retention-days: 30
    strategy:
      fail-fast: false
      matrix:
        partition:
        - 0
        - 1
        - 2
        - 3
