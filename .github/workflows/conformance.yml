name: Executable conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  declared-feature-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail on any required CPU or GPU contract gap
        run: python3 tools/check_feature_parity.py --scope contract --receipt build/enforced-parity/contract-audit.json
      - name: Retain explicit missing capabilities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declared-feature-parity-inventory
          path: build/enforced-parity/contract-audit.json
  cpu-wasm-durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INK_PARITY_REQUIRE_ALL: '1'
      INK_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned representation proof authoring dependency
        run: python -m pip install python-sat==1.9.dev5
      - name: Install pinned cross compiler
        run: |
          python -m pip install ziglang==0.14.1
          python - <<'PY'
          import os, pathlib, ziglang
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('INK_TEST_ZIG='+str(pathlib.Path(ziglang.__file__).parent/'zig')+'\n')
              f.write('INK_ZIG='+str(pathlib.Path(ziglang.__file__).parent/'zig')+'\n')
              f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
          PY
      - name: Install pinned independent proof checker
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "INK_TEST_LEAN=$HOME/.elan/bin/lean" >> "$GITHUB_ENV"
      - name: Rebuild disposable knowledge index
        run: |
          python tools/check_committed_snapshot.py
          python -m ink_knowledge --root . rebuild
        working-directory: knowledge
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Fetch pinned compiled host dependencies
        run: |
          mkdir -p build/host-deps/src
          cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/host-deps/
          python3 - <<'PYTHON'
          from pathlib import Path
          Path('build/host-deps/src/main.rs').write_text('fn main() {}\n')
          with Path('build/host-deps/Cargo.toml').open('a') as f:
              f.write('\n[workspace]\n')
          PYTHON
          cargo fetch --locked --manifest-path build/host-deps/Cargo.toml
      - name: Runtime policies and failure injection
        run: |
          node --test runtime/tests/backend-selection.mjs runtime/tests/durable-state.mjs
          node lowerings/gpu/tests/device_graph.mjs
      - name: Independent core and source-bound value admission
        run: |
          cargo test --manifest-path core/Cargo.toml --offline
          cargo test --manifest-path lowerings/rust/Cargo.toml --lib
          cargo test --test hardening regression_eval_
          cargo test --test temporary_lowering
          CARGO_TARGET_DIR=target cargo test --manifest-path lowerings/gpu/Cargo.toml --test temporary_bounds
          cargo test --test distribution --test source_syntax --test action_values --test general_laws --test semantic_optimisation
          cargo test --test internal_snapshots --test collect_before_build
      - name: Composable state proofs, publication, journals and bounded search
        run: |
          cargo test --test composable_state --test journal_compaction
          PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_store.py
          PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_state_calculus.py
          PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_admit_publication.py
          PYTHONPATH=planner:knowledge python3 -m unittest discover -s planner/tests -p test_semantic_search.py
          INK_COMPILER="$PWD/target/debug/ink" PYTHONPATH=knowledge python3 -m unittest discover -s knowledge/tests -p test_frontier_extensions.py
          python3 bench/composable-state/replay-admissions.py --compiler target/debug/ink --mathematics-source source-group examples/grouped-state.ink
          cargo test --test sequence_tree
      - name: Literal CPU and both Wasm lowerings, generated histories and crash recovery
        run: python3 tools/check_feature_parity.py --scope cpu --shard general --run --receipt build/enforced-parity/cpu-audit.json
      - name: Cold indexed proposals, measured batching selection and authenticated corruption
        env:
          PYTHONPATH: knowledge:planner
          INK_COMPILER: target/release/ink
        run: |
          cargo build --release --bin ink
          python planner/tests/automatic_candidates_integration.py target/release/ink planner/tests/fixtures/generic-batching.ink
          python -m unittest discover -s knowledge/tests -p test_generic_indexed.py
          python -m unittest discover -s knowledge/tests -p test_generic_extensions.py
          python -m unittest discover -s knowledge/tests -p test_point_authoring_hygiene.py
          python -m unittest discover -s planner/tests -p test_proposal_recipe.py
      - name: Retain reproducible programs, seeds and expected outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wasm-conformance
          path: |
            build/lowering-residency/*.json
            build/lowering-residency/*.wgsl
            build/generated-parity-f32/source.ink
            build/generated-parity-f32/script.json
            build/generated-parity-f32/expected.json
            build/generated-parity-u64/source.ink
            build/generated-parity-u64/script.json
            build/generated-parity-u64/expected.json
            build/enforced-keep-migration/oracle.json
            build/enforced-parity/numeric-definitions/oracle.json
            build/enforced-parity/cpu-audit.json
            build/async-parallel-transactions/source.ink
            build/async-parallel-transactions/script.json
            build/async-parallel-transactions/expected.json
            build/generated-parity-bend/source.ink
            build/generated-parity-bend/script.json
            build/generated-parity-bend/expected.json
            build/generated-parity-bend/gpu-script.json
            build/boolean-verdict-test/*.lean
            build/mixed-durable-native/source.ink
            build/mixed-durable-native/initial.json
            build/mixed-durable-native/recovery.json
            build/mixed-durable-native/expected.json
            build/representation-parity/**/checks.json
            build/representation-parity/**/source.ink
            build/representation-parity/**/request.json
            build/representation-parity/**/oracle.json
            build/representation-parity/**/producer.log
            build/representation-parity/**/*-run.log
            build/numerical-state-parity/source.ink
            build/numerical-state-parity/script.json
            build/numerical-state-parity/expected.json
            build/numerical-state-parity/gpu-script.json
            build/generated-parity/source.ink
            build/generated-parity/seeds.json
            build/generated-parity/script.json
            build/generated-parity/expected.json
            build/lowering-parity/source.ink
            build/lowering-parity/script.json
            build/lowering-parity/expected.json
            build/selected-checkpoint-parity/source.ink
            build/selected-checkpoint-parity/script.json
            build/selected-checkpoint-parity/expected.json
            build/selected-checkpoint-parity/input-core.json
            build/selected-checkpoint-parity/selected-core.json
            build/selected-checkpoint-parity/selection.json
            build/action-transitions-native/*.json
            build/action-transitions-native/source.ink
            build/action-transitions-native-evidence/*.json
            build/action-rule-parity/*.json
            build/action-rule-parity/source.ink
            build/action-rule-search/*.json
            build/action-rule-native-search/*.json
          retention-days: 30
  cpu-representations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INK_PARITY_REQUIRE_ALL: '1'
      INK_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned proof authoring and cross compiler
        run: |
          python -m pip install python-sat==1.9.dev5 ziglang==0.14.1
          python - <<'PY'
          import os, pathlib, ziglang
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('INK_TEST_ZIG='+str(pathlib.Path(ziglang.__file__).parent/'zig')+'\n')
              f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
          PY
      - name: Audit committed catalogue and rebuild disposable index
        working-directory: knowledge
        run: |
          python tools/check_committed_snapshot.py
          python -m ink_knowledge --root . rebuild
      - name: Fetch locked compiled host dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path core/Cargo.toml
          mkdir -p build/host-deps/src
          cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/host-deps/
          python3 - <<'PY'
          from pathlib import Path
          Path('build/host-deps/src/main.rs').write_text('fn main() {}\n')
          with Path('build/host-deps/Cargo.toml').open('a') as f:
              f.write('\n[workspace]\n')
          PY
          cargo fetch --locked --manifest-path build/host-deps/Cargo.toml
      - name: Reauthor current source fixtures through normal proof admission
        run: |
          cargo build --release --bin ink
          python3 bench/composable-state/prepare-fixtures.py --compiler target/release/ink
      - name: Complete representation histories across all required CPU and host paths
        run: python3 tools/check_feature_parity.py --scope cpu --shard representations --run --receipt build/enforced-parity/representations-audit.json
      - name: Retain exact programs, proof packets and host histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-representation-conformance
          path: |
            build/enforced-parity/representations-audit.json
            build/representation-parity/**/checks.json
            build/representation-parity/**/source.ink
            build/representation-parity/**/request.json
            build/representation-parity/**/oracle.json
            build/representation-parity/**/producer.log
            build/representation-parity/**/*-run.log
          retention-days: 30
  wgpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INK_TEST_WGPU: '1'
      INK_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vulkan software adapter
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Private device runtime directory and replayable seeds
        run: |
          mkdir -p build/xdg
          chmod 700 build/xdg
          echo "XDG_RUNTIME_DIR=$PWD/build/xdg" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('INK_PARITY_SEEDS=1,7,23,3735928559,'+str(int(os.environ['GITHUB_SHA'][:16],16))+'\n')
          PY
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Fetch the pinned device runtime dependencies
        run: |
          mkdir -p build/gpu-deps/src
          cp runtime/hosts/native/Cargo.toml runtime/hosts/native/Cargo.lock build/gpu-deps/
          python3 - <<'PY'
          from pathlib import Path
          Path('build/gpu-deps/src/main.rs').write_text('fn main() {}\n')
          with Path('build/gpu-deps/Cargo.toml').open('a') as f:
              f.write('\n[workspace]\n')
          PY
          cargo fetch --locked --manifest-path build/gpu-deps/Cargo.toml
      - name: Required GPU dispatch, exact u64 and binary32
        run: cargo test --test feature_parity -- --nocapture --test-threads=1
      - name: Actual wgpu dispatch and resident feedback
        run: cargo test --test lowering_parity --test generated_parity --test modules --test selected_checkpoint --test action_optimisation --test action_transitions --test numerical_state --test mixed_durability --test bend_features -- --nocapture --test-threads=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser CPU, JavaScript and actual WebGPU parity
        run: |
          python -m pip install ziglang==0.14.1
          ZIG_RUNNER=$(python -c 'import pathlib,ziglang;print(pathlib.Path(ziglang.__file__).parent/"zig")')
          INK_TEST_ZIG="$ZIG_RUNNER" cargo test --test feature_parity gpu -- --nocapture --test-threads=1
          INK_TEST_ZIG="$ZIG_RUNNER" cargo test --test bend_features parallel_buffers_recursion_and_scratch_agree_on_all_backends -- --nocapture
          python bench/gpu/prepare-lowering-parity-browser.py "$ZIG_RUNNER"
          npm ci --prefix bench/gpu --ignore-scripts --no-audit --no-fund
          node bench/gpu/lowering-parity-browser.mjs "$(command -v google-chrome)"
      - name: Retain GPU failure reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wgpu-conformance
          path: |
            build/browser-lowering-parity.json
            build/temporary-c-test/test.c
            build/lowering-residency/*.json
            build/lowering-residency/*.wgsl
            build/generated-parity-f32/source.ink
            build/generated-parity-f32/script.json
            build/generated-parity-f32/expected.json
            build/generated-parity-u64/source.ink
            build/generated-parity-u64/script.json
            build/generated-parity-u64/expected.json
            build/enforced-keep-migration/oracle.json
            build/enforced-parity/numeric-definitions/oracle.json
            build/generated-parity-bend/source.ink
            build/generated-parity-bend/script.json
            build/generated-parity-bend/expected.json
            build/generated-parity-bend/gpu-script.json
            build/boolean-verdict-test/*.lean
            build/mixed-durable-native/source.ink
            build/mixed-durable-native/initial.json
            build/mixed-durable-native/recovery.json
            build/mixed-durable-native/expected.json
            build/numerical-state-parity/source.ink
            build/numerical-state-parity/script.json
            build/numerical-state-parity/expected.json
            build/numerical-state-parity/gpu-script.json
            build/generated-parity/source.ink
            build/generated-parity/seeds.json
            build/generated-parity/script.json
            build/generated-parity/expected.json
            build/generated-parity/gpu-script.json
            build/selected-checkpoint-parity/source.ink
            build/selected-checkpoint-parity/script.json
            build/selected-checkpoint-parity/expected.json
            build/selected-checkpoint-parity/gpu-script.json
            build/selected-checkpoint-parity/input-core.json
            build/selected-checkpoint-parity/selected-core.json
            build/selected-checkpoint-parity/selection.json
            build/action-transitions-native/*.json
            build/action-transitions-native/source.ink
            build/action-transitions-native-evidence/*.json
            build/action-rule-parity/*.json
            build/action-rule-parity/source.ink
            build/action-rule-search/*.json
            build/action-rule-native-search/*.json
          retention-days: 30
