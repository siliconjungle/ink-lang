<!doctype html><meta charset="utf-8"><title>Adaptive39 fixed trial</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto}button,select{font:inherit;padding:8px}textarea{width:100%;height:480px}pre{white-space:pre-wrap}</style><h1>Adaptive39 fixed trial</h1><p>Real JS / Wasm / WebGPU; owned full outputs. Training and heldout sizes are frozen. Timings require metadata-bound serial gate files.</p><select id="phase"><option>validate</option><option>training</option><option>evaluation</option></select><button id="run">Run selected phase</button><pre id="status">Ready</pre><textarea id="result"></textarea><script type="module">import{runAdaptive}from'./adaptive39.mjs';const button=document.querySelector('#run'),state=document.querySelector('#status');button.onclick=async()=>{button.disabled=true;try{const p=document.querySelector('#phase').value;state.textContent='Running '+p;const r=await runAdaptive(new URL('./',location.href),{phase:p,progress:x=>state.textContent=x});window.ADAPTIVE39_RESULT=r;document.querySelector('#result').value=JSON.stringify(r,null,2);const file=p==='validate'?'browser-validation.json':p+'-results.json',response=await fetch('/save/'+file,{method:'POST',body:JSON.stringify(r)});if(!response.ok)throw Error('save '+response.status);state.textContent='Saved '+file+'; '+r.validation.length+' validations; '+r.samples.length+' samples'}catch(e){state.textContent=e.stack}finally{button.disabled=false}}</script>
