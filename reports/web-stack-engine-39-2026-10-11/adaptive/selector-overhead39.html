<!doctype html><meta charset="utf-8"><title>Selector overhead39 proxy</title><h1>Frozen-selector overhead proxy</h1><p>No pipeline or GPU execution. Timings require a separate frozen-profile gate after evaluation.</p><button id="validate">Untimed validate</button><button id="measure">Run gated proxy timing</button><pre id="status">Ready</pre><textarea id="result" style="width:95%;height:480px"></textarea><script type="module">import{runSelectorOverhead}from'./selector-overhead39.mjs';const state=document.querySelector('#status');async function go(validateOnly){try{const r=await runSelectorOverhead(new URL('./',location.href),{validateOnly,progress:x=>state.textContent=x});window.SELECTOR_OVERHEAD39_RESULT=r;document.querySelector('#result').value=JSON.stringify(r,null,2);const file=validateOnly?'overhead-validation.json':'overhead-results.json';const response=await fetch('/save/'+file,{method:'POST',body:JSON.stringify(r)});if(!response.ok)throw Error('save '+response.status);state.textContent='Saved '+file+'; '+r.validation.length+' validations / '+r.samples.length+' samples'}catch(e){state.textContent=e.stack}}document.querySelector('#validate').onclick=()=>go(true);document.querySelector('#measure').onclick=()=>go(false);</script>
