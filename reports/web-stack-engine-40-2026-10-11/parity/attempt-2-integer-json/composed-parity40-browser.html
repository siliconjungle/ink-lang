<!doctype html><meta charset="utf-8"><title>Composed target parity 40</title><style>body{font:16px system-ui;margin:32px;background:#101827;color:#e7edf7}button{padding:12px;font:inherit}pre{white-space:pre-wrap}</style><h1>Composed target parity 40</h1><p>Untimed complete outputs, captured inputs, retained result lifetimes and actual GPU counters.</p><button id="run">Run untimed parity</button><pre id="status">Ready</pre><script type="module">import{runParity}from'./composed-parity40-browser.mjs';const run=document.querySelector('#run'),status=document.querySelector('#status');run.onclick=async()=>{run.disabled=true;try{const result=await runParity(new URL('../',location),x=>status.textContent=x);window.PARITY40_RESULT=result;const saved=await fetch('/save/parity40',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});if(!saved.ok)throw Error('save '+saved.status);status.textContent='Saved '+result.rows.length+' checks; '+result.actual_gpu_calls+' actual GPU calls; zero timing samples.'}catch(e){window.PARITY40_FAILURE={status:'failed',error:e.stack??String(e)};await fetch('/save/parity40-failure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window.PARITY40_FAILURE)});status.textContent=e.stack??String(e);run.disabled=false}};</script>
