<!doctype html><meta charset="utf-8"><title>Ink transport attribution 40</title><style>body{font:16px system-ui;margin:3rem;max-width:65rem;background:#10131c;color:#e9edf6}button{padding:1rem;margin-right:1rem}pre{white-space:pre-wrap}</style><h1>Complete-call transport attribution</h1><p>Untimed validation checks complete values, captured inputs, owned lifetimes and actual GPU counters. Instrumented timings require a parent-issued exclusive gate and are diagnostic only.</p><button id="validate">Validate without timings</button><button id="measure">Run gated attribution</button><pre id="status">Ready</pre><script type="module">
import{run}from'./browser-attribution-runner.mjs';const status=document.querySelector('#status');async function invoke(timed){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await run(new URL('/',location.href),{timed,progress:m=>status.textContent=m});const response=await fetch('/save/transport40/'+(timed?'attribution':'validation'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});if(!response.ok)throw Error(await response.text());status.textContent='Saved PASS '+JSON.stringify({checks:result.rows.length,warmups:result.warmups.length,actual_gpu:result.actual_gpu_calls,timing_samples:result.timing_samples})}catch(e){status.textContent=e.stack;await fetch('/save/transport40/failure',{method:'POST',body:JSON.stringify({status:'failed',timed,error:e.stack})})}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}document.querySelector('#validate').onclick=()=>invoke(false);document.querySelector('#measure').onclick=()=>invoke(true);
</script>
