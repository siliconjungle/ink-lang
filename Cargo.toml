[package]
name = "ink"
version = "0.1.0"
edition = "2021"
default-run = "ink"
publish = false
description = "Ink: a small language with locally checked implementation proofs"
repository = "https://github.com/siliconjungle/ink-lang"

[lib]
name = "verified_language"

[[bin]]
name = "ink"
path = "src/bin/ink.rs"

[[bin]]
name = "lang"
path = "src/main.rs"

[workspace]
members = []
exclude = ["runtime", "planner", "core", "lowerings/c", "lowerings/rust", "lowerings/wasm", "lowerings/gpu", "lowerings/js", "build", "build/**", "reports", "reports/**"]

[dependencies]
ink-runtime = { path = "runtime" }
ink-core = { path = "core" }
ink-lowering-c = { path = "lowerings/c" }
ink-lowering-rust = { path = "lowerings/rust" }
ink-lowering-wasm = { path = "lowerings/wasm" }
ink-lowering-gpu = { path = "lowerings/gpu" }
ink-lowering-js = { path = "lowerings/js" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[patch."https://github.com/siliconjungle/ink-lang"]
ink-core = { path = "core" }

[patch."https://github.com/siliconjungle/ink-lowering-c"]
ink-lowering-c = { path = "lowerings/c" }

[patch."https://github.com/siliconjungle/ink-lowering-gpu"]
ink-lowering-gpu = { path = "lowerings/gpu" }

[patch."https://github.com/siliconjungle/ink-lowering-wasm"]
ink-lowering-wasm = { path = "lowerings/wasm" }

[patch."https://github.com/siliconjungle/ink-lowering-js"]
ink-lowering-js = { path = "lowerings/js" }
