[package]
license = "MIT"
name = "ink-core"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
name = "ink_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

# Independent workspace: resolve/build core without distribution submodules.
[workspace]
